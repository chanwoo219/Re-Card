spring:
  application:
    name: re-card
  datasource:
    url: jdbc:h2:mem:sceneswap;MODE=MySQL
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: embedded

springdoc:
  swagger-ui:
    path: /swagger-ui.html
